name: tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        node: ['20', '22', '24']
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - name: Run the unit tests
        run: node --test test/host.test.mjs test/client.test.mjs test/bypass.test.mjs

      - name: Check for corrupted text encodings
        if: matrix.os == 'ubuntu-latest'
        run: node tools/check-encoding.mjs

  powershell:
    # The installer and verifier are the part Windows users actually run; make
    # sure they at least parse under the Windows PowerShell that ships with the OS.
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Parse-check the PowerShell scripts
        shell: powershell
        run: |
          $failed = 0
          foreach ($script in 'install.ps1', 'verify.ps1', 'build-package.ps1') {
            $errors = $null
            [void][System.Management.Automation.Language.Parser]::ParseFile(
              (Resolve-Path $script), [ref]$null, [ref]$errors)
            if ($errors.Count -gt 0) {
              Write-Host "::error file=$script::$($errors[0].Message)"
              $failed = 1
            } else {
              Write-Host "ok: $script"
            }
          }
          exit $failed
